name: binarybrew

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: binarybrew
      POSTGRES_PASSWORD: binarybrew_dev
      POSTGRES_DB: binarybrew
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates the integration test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binarybrew -d binarybrew"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
